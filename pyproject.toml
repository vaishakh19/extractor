[project]
name = "local-crypto-trading-bot"
version = "0.1.0"
description = "Local-first crypto trading, paper trading, and backtesting engine"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
